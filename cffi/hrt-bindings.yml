output: lisp/heart/hrt-bindings.lisp
package: hrt
pkg-config:
  - wlroots-0.20
  - heart
arguments:
  - "-DWLR_USE_UNSTABLE"
  - "-Ibuild/heart/protocols"
files:
  - heart/include/hrt/hrt_input.h
  - heart/include/hrt/hrt_view.h
  - heart/include/hrt/hrt_output.h
  - heart/include/hrt/hrt_scene.h
  - heart/include/hrt/hrt_message.h
  - heart/include/hrt/hrt_event_loop.h
  - heart/include/hrt/hrt_layer_shell.h
  - heart/include/hrt/hrt_server.h
  - heart/include/hrt/hrt_theme.h
  - heart/include/hrt/hrt_border_box.h
pointer-expansion:
  include:
    match: "hrt.*"
enum-constants:
  include:
    match: ".*"
  exclude:
    names:
    - window-gravity
    - hrt-border-style
    - hrt-layer-shell-keyboard-interactivity
make-inline:
  - include:
      match: "hrt.*"
    feature-flag: "-HRT-DEBUG"
string-return:
  include:
    names:
      - "hrt_output_name"
      - "hrt_output_make"
      - "hrt_output_model"
      - "hrt_output_serial"
